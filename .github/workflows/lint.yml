name: lint

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  verify-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify wiki integrity
        run: python3 tools/verify_wiki.py
